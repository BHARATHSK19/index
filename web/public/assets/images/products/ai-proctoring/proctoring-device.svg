      <text x="430" y="16" fill="#4ADE80" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">100% Enforced</text>
      <rect x="0" y="26" width="430" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="26" width="430" height="8" rx="4" fill="#22C55E"/>
