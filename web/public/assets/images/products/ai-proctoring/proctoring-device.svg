    <g transform="translate(0, 156)"><text x="42" y="26" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Browser Lockdown</text></g>
    <g transform="translate(0, 208)"><text x="42" y="26" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Audio Analysis</text></g>
