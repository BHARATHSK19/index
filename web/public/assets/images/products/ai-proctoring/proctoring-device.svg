        <rect x="630" y="16" width="84" height="26" rx="6" fill="rgba(201,102,47,0.2)"/>
        <text x="672" y="33" fill="#F39C6B" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FLAGGED</text>
