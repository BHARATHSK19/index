  <text x="80" y="46" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Construction</text>
  <text x="80" y="62" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Site &amp; BOQ OS</text>
  
