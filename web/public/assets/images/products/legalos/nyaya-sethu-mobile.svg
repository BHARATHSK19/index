<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" width="100%" height="100%">
  
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#09121E"/>
        <stop offset="100%" stop-color="#060C14"/>
      </linearGradient>
      <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#132238" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#0B1524" stop-opacity="0.95"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#C9662F"/>
        <stop offset="100%" stop-color="#F39C6B"/>
      </linearGradient>
      <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F39C6B" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#C9662F" stop-opacity="0.0"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>
  
  <rect width="400" height="860" fill="#0A1422"/>
  
  <!-- Header -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#C9662F"/>
    <text x="18" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="18" text-anchor="middle">N</text>
    <text x="48" y="22" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="15">Nyaya Sethu</text>
    <text x="48" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">High Court Chamber #4</text>
  </g>

  <!-- Urgent Alert Card -->
  <g transform="translate(20, 84)">
    <rect x="0" y="0" width="360" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(243,156,107,0.4)" stroke-width="1"/>
    <circle cx="24" cy="28" r="5" fill="#EF4444"/>
    <text x="38" y="32" fill="#F87171" font-family="system-ui, sans-serif" font-weight="700" font-size="11">HEARING IN 30 MINUTES</text>
    <text x="24" y="66" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="17">Apex Bank v. Horizon Infra</text>
    <text x="24" y="90" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Court Hall 4 · Item 12 · Arguments</text>
    <rect x="24" y="106" width="140" height="28" rx="6" fill="#C9662F"/>
    <text x="94" y="124" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">View Brief &amp; Notes</text>
  </g>

  <!-- Stats Grid -->
  <g transform="translate(20, 254)">
    <rect x="0" y="0" width="172" height="90" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)"/>
    <text x="16" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">TODAY'S HEARINGS</text>
    <text x="16" y="64" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="800">7</text>

    <rect x="188" y="0" width="172" height="90" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)"/>
    <text x="204" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">ACTIVE MATTERS</text>
    <text x="204" y="64" fill="#F39C6B" font-family="system-ui, sans-serif" font-size="28" font-weight="800">38</text>
  </g>

  <!-- Next Cause List Item -->
  <g transform="translate(20, 364)">
    <text x="4" y="16" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">NEXT IN CAUSE LIST</text>
    <rect x="0" y="28" width="360" height="88" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="56" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="14">State v. Mehra · Hall 8</text>
    <text x="20" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">11:15 AM · Arguments on Charge</text>
    <rect x="270" y="44" width="70" height="24" rx="12" fill="rgba(34,197,94,0.15)"/>
    <text x="305" y="60" fill="#4ADE80" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">Ready</text>
  </g>
</svg>