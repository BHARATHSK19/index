<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#09121E"/>
        <stop offset="100%" stop-color="#060C14"/>
      </linearGradient>
      <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#132238" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#0B1524" stop-opacity="0.95"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#C9662F"/>
        <stop offset="100%" stop-color="#F39C6B"/>
      </linearGradient>
      <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F39C6B" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#C9662F" stop-opacity="0.0"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>
  
  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  
  <rect x="0" y="0" width="240" height="1000" fill="#0A1422" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="28" y="28" width="40" height="40" rx="10" fill="#C9662F"/>
  <text x="48" y="54" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="20" text-anchor="middle">T</text>
  <text x="80" y="46" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16">TravelOS</text>
  <text x="80" y="62" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Smart Travel Engine</text>
  
  <g transform="translate(18, 100)">
    <rect x="0" y="0" width="204" height="42" rx="8" fill="rgba(201,102,47,0.18)" stroke="rgba(243,156,107,0.35)" stroke-width="1"/>
    <rect x="0" y="6" width="3" height="30" rx="1.5" fill="#C9662F"/>
    <text x="42" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Live Trips (126)</text>
    <g transform="translate(0, 52)"><text x="42" y="26" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Flight PNR Tracker</text></g>
    <g transform="translate(0, 104)"><text x="42" y="26" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Hotel Bookings &amp; Vouchers</text></g>
    <g transform="translate(0, 156)"><text x="42" y="26" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Fleet &amp; Cab Dispatch</text></g>
    <g transform="translate(0, 208)"><text x="42" y="26" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Expense Reimbursements</text></g>
    <g transform="translate(0, 260)"><text x="42" y="26" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Corporate Travel Desk</text></g>
  </g>

  <rect x="240" y="0" width="1360" height="74" fill="#0A1422" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="280" y="44" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Global Travel Dispatch &amp; Passenger Manifest</text>

  <g transform="translate(1320, 22)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.3)"/>
    <circle cx="16" cy="16" r="4" fill="#22C55E"/>
    <text x="28" y="20" fill="#4ADE80" font-family="system-ui, sans-serif" font-weight="700" font-size="11">PNR SYNC: ACTIVE</text>
  </g>

  <!-- KPIs -->
  <g transform="translate(280, 104)">
    <rect x="0" y="0" width="295" height="120" rx="12" fill="url(#cardGrad)" stroke="rgba(243,156,107,0.25)"/>
    <text x="24" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ACTIVE BOOKINGS</text>
    <text x="24" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="36" font-weight="800">126</text>
    <text x="110" y="78" fill="#F39C6B" font-family="system-ui, sans-serif" font-size="13">This Month</text>

    <rect x="325" y="0" width="295" height="120" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
    <text x="349" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TRAVELLERS EN ROUTE</text>
    <text x="349" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="36" font-weight="800">340</text>
    <text x="440" y="78" fill="#4ADE80" font-family="system-ui, sans-serif" font-size="13">Live GPS Tracking</text>

    <rect x="650" y="0" width="295" height="120" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
    <text x="674" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PROCESSED CLAIMS</text>
    <text x="674" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="34" font-weight="800">₹4.8L</text>
    <text x="800" y="78" fill="#4ADE80" font-family="system-ui, sans-serif" font-size="12">Instant UPI</text>

    <rect x="975" y="0" width="295" height="120" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
    <text x="999" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ON-TIME FLIGHT INDEX</text>
    <text x="999" y="80" fill="#4ADE80" font-family="system-ui, sans-serif" font-size="34" font-weight="800">96.4%</text>
  </g>

  <!-- Big Table: Live Trips -->
  <g transform="translate(280, 256)">
    <rect x="0" y="0" width="780" height="700" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
    <text x="28" y="40" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="18">Live Itinerary &amp; Cab Alerts</text>

    <g transform="translate(24, 76)">
      <rect x="0" y="0" width="732" height="76" rx="8" fill="rgba(15,28,46,0.6)"/>
      <circle cx="20" cy="38" r="6" fill="#C9662F"/>
      <text x="38" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="15">PNR 6E-2401 · BLR → DEL (Priya Sharma)</text>
      <text x="38" y="54" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Flight On-Time · Airport Cab #KA-01-MJ-9912 Dispatched to T2</text>
      <rect x="620" y="24" width="84" height="28" rx="14" fill="rgba(201,102,47,0.18)"/>
      <text x="662" y="42" fill="#F39C6B" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">EN ROUTE</text>
    </g>

    <g transform="translate(24, 164)">
      <rect x="0" y="0" width="732" height="76" rx="8" fill="rgba(15,28,46,0.6)"/>
      <circle cx="20" cy="38" r="6" fill="#22C55E"/>
      <text x="38" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="15">PNR AI-506 · BOM → LHR (Rahul Varma)</text>
      <text x="38" y="54" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Gate Change to G14 · Passenger notified via WhatsApp &amp; SMS</text>
      <rect x="620" y="24" width="84" height="28" rx="14" fill="rgba(34,197,94,0.15)"/>
      <text x="662" y="42" fill="#4ADE80" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">BOARDING</text>
    </g>

    <g transform="translate(24, 252)">
      <rect x="0" y="0" width="732" height="76" rx="8" fill="rgba(15,28,46,0.6)"/>
      <circle cx="20" cy="38" r="6" fill="#22C55E"/>
      <text x="38" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="15">Hotel Vivanta New Delhi · 3 Nights Confirmed</text>
      <text x="38" y="54" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Corporate Rate Code: OJX-CORP · Vouchers emailed</text>
      <rect x="620" y="24" width="84" height="28" rx="14" fill="rgba(34,197,94,0.15)"/>
      <text x="662" y="42" fill="#4ADE80" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">CONFIRMED</text>
    </g>
  </g>

  <!-- Right Panel -->
  <g transform="translate(1085, 256)">
    <rect x="0" y="0" width="485" height="700" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="40" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="18">Destination Insights</text>
    <g transform="translate(24, 80)">
      <text x="0" y="16" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13">Domestic (Delhi, Mumbai, Goa)</text>
      <text x="430" y="16" fill="#F39C6B" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">68%</text>
      <rect x="0" y="26" width="430" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="26" width="292" height="8" rx="4" fill="url(#accentGrad)"/>
    </g>
    <g transform="translate(24, 150)">
      <text x="0" y="16" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13">International (London, Dubai, Singapore)</text>
      <text x="430" y="16" fill="#F39C6B" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">32%</text>
      <rect x="0" y="26" width="430" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
      <rect x="0" y="26" width="138" height="8" rx="4" fill="url(#accentGrad)"/>
    </g>
  </g>
</svg>